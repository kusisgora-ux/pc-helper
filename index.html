<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Helper</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='cursor.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <script src="{{ url_for('static', filename='cursor.js') }}" defer></script>
</head>
<body>
    <div class="cursor-glow" style="opacity: 0;"></div>
    <div class="orb"></div>
    <div class="theme-toggle" onclick="toggleTheme()">
    <span id="theme-icon">🌙</span>
</div>

    <nav class="nav">
        <div class="logo">PC Helper</div>
        <div class="nav-links">
            <a href="/">Главная</a>
            <a href="/catalog">Каталог</a>
            <a href="/configurator">Конфигуратор</a>
            <a href="/theory">Обучение</a>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <div class="footer">PC Helper © 2026</div>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
